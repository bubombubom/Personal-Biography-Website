    <body>
        <nav id="nav">
            <div class="left_links">

        <main class="contact_section">
            <section class="contact_box">
                <div class="contact_grid">
                    <div class="form_area">
                        <h1><span>Contact me!</span></h1>
                        <form action="https://formsubmit.co/baronryle@gmail.com" method="POST">
                            <input type="hidden" name="_next" value="https://bubombubom.github.io/Personal-Biography-Website/contact.html">
                            <input type="hidden" name="_subject" value="New message from Contact page" />
                            <input type="hidden" name="_captcha" value="false" />
                            <input type="text" name="name" placeholder="Name:" required />
                            <input type="email" name="email" placeholder="E-mail:" required />
                            <textarea name="message" placeholder="Message:" required></textarea>
                            <div class="btn_row">
                                <button type="submit">Send!</button>
                            </div>
                        </form>
                    </div>

                    <aside class="socials">
                        <a href="https://instagram.com/emilryle" target="_blank" rel="noopener noreferrer">
                            <img src="images/instagram_logo.svg" alt="Instagram" />
                            <p>Instagram</p>
                        </a>
                        <a href="https://facebook.com/emil.reily" target="_blank" rel="noopener noreferrer">
                            <img src="images/facebook_logo.svg" alt="Facebook" />
                            <p>Facebook</p>
                        </a>
                        <a href="https://www.linkedin.com/in/emil-baron-a58564402/" target="_blank" rel="noopener noreferrer">
                            <img src="images/linkedin_logo.svg" alt="LinkedIn" />
                            <p>LinkedIn</p>
                        </a>
                    </aside>
                </div>
            </section>
